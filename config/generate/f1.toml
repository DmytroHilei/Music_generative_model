# F1 from captions (2026-10-28, the app engine's default): the 450M with caption, section and length inputs after
# the 600-it caption phase (f1_cap; the long run's final weights in checkpoints/f1 fail the search's gates), from BOS,
# with the gen_search winner b19 (guidance 2.5, T 1.1, DRY 3 on pitch-class chords). --length-seconds is the model's
# length input; eos-ramp / length-stop end rows that run over (not tuned: gen_search's length axis has not run);
# eos-floor 0.85: no end before 85% of the length (2026-10-28: 1 in 6 rows of 120 s ended at ~45 s on its own).
# block-size 2048: f1_cap's checkpoint keeps its caption phase's 512 (the long run trained at 2048; RoPE), which kept
# only the last 512 notes in view past ~40-60 s.
# Usage: generate.py --config f1 --text "..." --length-seconds 60 --output x.mid
# keep-style + lock-instruments (2026-10-28, 3 captions x 2 seeds x 120 s): after the first 256 notes their own
# description is the section caption of the rest and only their instruments (+ named families not yet played) remain:
# density max / min over the quarters 8.1x -> 4.3x, loudness swing 16 -> 7, instruments in the last quarter 10 -> 4.
checkpoint = "checkpoints/f1_cap"
block-size = 2048
keep-style = true
lock-instruments = true
sample-instruments = true
cfg-scale = 2.5
temperature = 1.1
dry-multiplier = 3
dry-key = "pitch_class"
dry-allowed = 16
dry-base = 1.15
eos-ramp = 0.5
length-stop = 1.2
eos-floor = 0.85
max-new-tokens = 2048
