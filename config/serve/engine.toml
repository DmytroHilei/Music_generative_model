# The app engine's settings: python -m musicar.serve [--config this file]; any key can be overridden on the command
# line as --key value (dashes or underscores), e.g. --idle-unload-min 30.

checkpoint = "checkpoints/f1_cap"  # F1 after its caption phase (gen_search b19 and the retrieval check ran on it)
base = ["f1"]            # generate.py presets (config/generate/) every request starts from; their checkpoint is ignored
name = "laptop"          # the engine's name in /v1/health
max_queue = 8            # jobs waiting at most; more get 429
idle_unload_min = 10     # free the GPU after this many minutes without a job (0 = never)
keep_jobs_min = 60       # finished jobs (their events and MIDI) are forgotten after this many minutes
heartbeat_s = 20         # an SSE comment line when a stream has been quiet this long (proxies close idle streams)
min_free_mb = 3500       # GPU memory free to load the model; less (training running) = the job ends with an error
batch_candidates = 4     # best-of candidates generated together; more run in further batches (8 GB: 8 x 240 s ran
                         # out of memory, 4 fits)
default_preset = "balanced"

# Access: every route but /v1/health needs "Authorization: Bearer <token>" (python -m musicar.serve.tokens add <name>)
auth = true                              # false only for local development (--no-auth)
tokens_db = "data/serve/tokens.sqlite"   # token hashes, relative to the repository (data/ is not in git)
per_token_jobs = 2                       # unfinished jobs one token may have; more get 429
cors_origins = ["http://localhost:3000", "https://musicar-ivory.vercel.app"]  # pages that may call the engine
admin_key_file = "data/serve/admin.key"  # the page's key for minting gh-<login> tokens at GitHub sign-in (made by
                                         # python -m musicar.serve.tokens admin-key; no file = the route is off)

# "Start from a real opening" (request opening: true): each candidate continues the first 128 notes of a real song
# whose captions match the request's (left out of the result). Strict: when the caption asks for a genre / mood, only
# songs labeled with it (soft ranking when no song is). 2026-10-28 on f1_cap: F 1.27 vs 1.06, J 0.99 vs 0.81.
opening_store = "gigamidi_replay_train"
opening_strict = ["genre", "mood"]

# The page's three-step control: decoding options on top of `base` (generate.py names); a request's overrides apply
# after these. balanced = the gen_search winner as in config/generate/f1.toml; faithful / wild are not measured.
[presets.faithful]
cfg_scale = 3.0
temperature = 1.0

[presets.balanced]

[presets.wild]
cfg_scale = 1.5
temperature = 1.2
