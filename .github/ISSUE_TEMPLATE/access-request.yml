name: Request access to the live page
description: Ask to write pieces on musicar-ivory.vercel.app
title: "Access request: "
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        The page writes pieces with the model on my laptop GPU, so writing needs approval.
        Once this issue is labeled `approved`, open https://musicar-ivory.vercel.app, go to Settings and press
        **Sign in with GitHub** with the account that opened this issue. Nothing secret is posted here.
  - type: textarea
    id: plans
    attributes:
      label: What would you like to try? (optional)
      description: Styles, instruments, languages; it helps me see how the model is used.
    validations:
      required: false
