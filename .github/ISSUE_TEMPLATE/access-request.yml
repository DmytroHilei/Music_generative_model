name: Request access to the live page
description: Ask for a personal invite link to musicar-ivory.vercel.app
title: "Access request: "
labels: ["access-request"]
body:
  - type: markdown
    attributes:
      value: |
        The page writes pieces with the model on my laptop GPU, so new pieces need a personal invite link.
        The link works like a password: it is sent privately, never in this issue.
  - type: input
    id: contact
    attributes:
      label: Where should the link go?
      description: >-
        Everyone who can see this issue sees this field, so give a contact you don't mind showing (e.g. a Telegram
        @handle), or leave it empty and I'll answer here how to get the link.
    validations:
      required: false
  - type: textarea
    id: plans
    attributes:
      label: What would you like to try? (optional)
      description: Styles, instruments, languages; it helps me see how the model is used.
    validations:
      required: false
